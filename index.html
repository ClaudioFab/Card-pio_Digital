<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aroma</title>
    <!-- Conecção com style css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <h1 class="az1">Cardápio Digital – Café Aroma
            <h2 class="az2">Especialidades da Casa</h2>
    </header>

    <main>
        <!-- Primeira sessão -->
        <section id="cafes">
            <h3 class="z22">Cafés Quentes</h3>
            <hr>
            <div>
                <p class="z11">Expresso</p>
                <p class="valor">R$ 8,00</p>
                <p class="z11">Cappuccino</p>
                <p class="valor">R$ 8,00</p>
                <p class="z11">Latte Art</p>
                <p class="valor">R$ 8,00</p>
            </div>

        </section>

        <!-- Segunda sessão -->
        <section id="sobremesas">
            <h3 class="z22">Sobremesas</h3>
            <hr>
            <div>
                <p class="z11">Bolo de Chocolate</p>
                <p class="valor">R$ 8,00</p>
                <p class="z11">Croissant</p>
                <p class="valor">R$ 8,00</p>
                <p class="z11">Torta de Maçã</p>
                <p class="valor">R$ 8,00</p>
            </div>

        </section>
    </main>
    <!-- Nome empresa, direitos autorais, ano, contratos, links, informações institucionais -->
    <img src="img/Copo1.png" width="490" height="745" alt="ImagemCafe">
    <footer>
        <p>Horário de funcionamento: 8h às 20h</p>
    </footer>
</body>

</html>
