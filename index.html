<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aroma</title>
    <!-- Conecção com style css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <h1 class="titulo">Cardápio Digital – Café Aroma
            <h2 class="subtitulo">Especialidades da Casa</h2>
    </header>

    <main>
        <!-- Primeira sessão -->
        <section id="cafes">
            <h3 class="variedade">Cafés Quentes</h3>
            <!-- linha divisória -->
            <hr>
            <!-- Span deixa cada produto em um único parágrafo alinhado dentro de "p" -->
            <p class="produto">
                <span>Expresso</span>
                <span class="negrito">R$ 8,00</span>
            </p>

            <p class="produto">
                <span>Cappuccino</span>
                <span class="negrito">R$ 12,00</span>
            </p>

            <p class="produto">
                <span>Latte Art</span>
                <span class="negrito">R$ 15,00</span>
            </p>

        </section>

        <!-- Segunda sessão -->
        <section id="sobremesas">
            <h3 class="variedade">Sobremesas</h3>
            <hr>
            <p class="produto">
                <span>Bolo de Chocolate</span>
                <span class="negrito">R$ 10,00</span>
            </p>

            <p class="produto">
                <span>Croissant</span>
                <span class="negrito">R$ 7,00</span>
            </p>

            <p class="produto">
                <span>Torta de Maçã</span>
                <span class="negrito">R$ 9,00</span>
            </p>

        </section>
    </main>
    <!-- Nome empresa, direitos autorais, ano, contratos, links, informações institucionais -->
     <!-- Imagem café -->
    <img src="img/Copo1.png" width="490" height="745" alt="ImagemCafe">
    <footer>
        <!-- informações do rodapé -->
        <p>Horário de funcionamento: 8h às 20h</p>
    </footer>
</body>

</html>
